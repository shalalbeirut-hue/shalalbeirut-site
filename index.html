<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shalal Beirut — Coming Soon</title>
  <meta name="description" content="Shalal Beirut — our new website is coming soon.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1f24;
      --bg2: #123238;
      --text: #eef4f2;
      --muted: #9fb8b5;
      --accent: #7fd1c7;
      --line: rgba(255,255,255,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 70%);
      background-color: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
      overflow-x: hidden;
      position: relative;
    }
    /* falling water lines */
    .falls { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .falls span {
      position: absolute; top: -40%;
      width: 1px; height: 40%;
      background: linear-gradient(to bottom, transparent, var(--accent));
      opacity: 0.18;
      animation: fall linear infinite;
    }
    @keyframes fall { to { transform: translateY(350%); } }
    @media (prefers-reduced-motion: reduce) { .falls { display: none; } }

    main { position: relative; text-align: center; max-width: 560px; width: 100%; }
    .brand {
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-size: clamp(2.6rem, 9vw, 4.2rem);
      letter-spacing: 0.04em;
      line-height: 1.05;
    }
    .brand-ar {
      font-family: "Tajawal", sans-serif;
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      color: var(--accent);
      margin-top: 6px;
    }
    .divider { width: 60px; height: 1px; background: var(--accent); margin: 28px auto; opacity: 0.6; }
    h2 { font-weight: 500; font-size: 1.15rem; letter-spacing: 0.18em; text-transform: uppercase; }
    p { color: var(--muted); line-height: 1.7; margin-top: 12px; }
    .ar { font-family: "Tajawal", sans-serif; direction: rtl; font-size: 1.1rem; }
    .ar-title { color: var(--text); font-size: 1.25rem; margin-top: 26px; }
    .contact {
      display: inline-block; margin-top: 34px;
      padding: 12px 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text); text-decoration: none; font-size: 0.95rem;
      transition: border-color .2s, background .2s;
    }
    .contact:hover { border-color: var(--accent); background: rgba(127,209,199,0.08); }
    footer { margin-top: 44px; font-size: 0.8rem; color: var(--muted); opacity: 0.7; }
  </style>
</head>
<body>
  <div class="falls" aria-hidden="true"></div>

  <main>
    <div class="brand">Shalal Beirut</div>
    <div class="brand-ar" lang="ar">شلال بيروت</div>

    <div class="divider"></div>

    <h2>Coming Soon</h2>
    <p>Our new website is under construction.<br>We'll be ready very soon.</p>

    <p class="ar ar-title" lang="ar">قريباً</p>
    <p class="ar" lang="ar">موقعنا الجديد قيد الإنشاء، ترقبونا قريباً.</p>

    <a class="contact" href="mailto:shalalbeirut@gmail.com">shalalbeirut@gmail.com</a>

    <footer>&copy; <span id="y"></span> Shalal Beirut</footer>
  </main>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    var f = document.querySelector('.falls');
    for (var i = 0; i < 28; i++) {
      var s = document.createElement('span');
      s.style.left = (Math.random() * 100) + '%';
      s.style.animationDuration = (4 + Math.random() * 6) + 's';
      s.style.animationDelay = (-Math.random() * 10) + 's';
      f.appendChild(s);
    }
  </script>
</body>
</html>
